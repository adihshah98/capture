[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capture"
version = "1.0.0"
description = "Self-hosted session recording and replay built on rrweb"
requires-python = ">=3.11"
# Read from requirements.txt rather than duplicated here: deploy.sh builds its
# venv with `pip install -r requirements.txt`, and two dependency lists drift.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Listed explicitly. Auto-discovery would sweep in `src`, `tests` and `migrations`
# as top-level packages, which is how a test helper ends up importable in prod.
[tool.setuptools]
packages = ["capture", "capture.api", "capture.analyze"]

[tool.ruff]
line-length = 100
target-version = "py311"
# capture/analyze is the co-founder's; src/analyze is its Node extractor.
# .claude holds agent git worktrees — full copies of this repo. Without this,
# `ruff .` walks them and reports (or fixes) findings in someone else's checkout.
extend-exclude = ["capture/analyze", "src/analyze", ".venv", "node_modules", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # The formatter owns line length; it cannot always split a long string.
    "E501",
    # FastAPI's Query()/Depends() defaults are the framework's calling convention.
    "B008",
    # ClassVar annotations on mutable class attrs — noise for this codebase's shape.
    "RUF012",
    # `×` in cross-tab labels is deliberate and matches analyze.py's output.
    "RUF001",
    # isinstance(x, int | float) is slower than the tuple form in CPython, and
    # every site here is on the ingest path. Not worth throughput for syntax.
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
exclude = ["^\\.venv/", "^tests/"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# `exclude` only skips directory crawling, not import-following, so the
# co-founder's package needs ignore_errors to actually stay out of our report.
[[tool.mypy.overrides]]
module = "capture.analyze.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no database, no network, no disk",
    "integration: needs a real Postgres",
]
