[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capture"
version = "1.0.0"
description = "Self-hosted session recording and replay built on rrweb"
requires-python = ">=3.11"
# Read from requirements.txt rather than duplicated here: deploy.sh builds its
# venv with `pip install -r requirements.txt`, and two dependency lists drift.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Listed explicitly. Auto-discovery would sweep in `src`, `tests` and `migrations`
# as top-level packages, which is how a test helper ends up importable in prod.
[tool.setuptools]
packages = ["capture", "capture.api", "capture.analyze"]

[tool.ruff]
line-length = 100
target-version = "py311"
# src/analyze is the Node extractor, not Python. .claude holds agent git
# worktrees — full copies of this repo. Without this, `ruff .` walks them and
# reports (or fixes) findings in someone else's checkout.
extend-exclude = ["src/analyze", ".venv", "node_modules", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # The formatter owns line length; it cannot always split a long string.
    "E501",
    # FastAPI's Query()/Depends() defaults are the framework's calling convention.
    "B008",
    # ClassVar annotations on mutable class attrs — noise for this codebase's shape.
    "RUF012",
    # `×` in cross-tab labels is deliberate and matches analyze.py's output.
    "RUF001",
    # isinstance(x, int | float) is slower than the tuple form in CPython, and
    # every site here is on the ingest path. Not worth throughput for syntax.
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
exclude = ["^\\.venv/", "^tests/"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
# The package as installed, not the repo root.
#
# `omit` still drops capture/analyze, but the reason it was written for is gone:
# the package is no longer excluded from ruff or mypy, so "someone else's code"
# is not why it is unmeasured. What is left is a size argument — it is a quarter
# of capture/ — and that is worth revisiting once there is a baseline to compare
# against, rather than in the commit that lifted the linters.
source = ["capture"]
omit = ["capture/analyze/*"]
# Load-bearing. Every test_api_*.py drives a real uvicorn *subprocess*
# (tests/server/servercase.py), so without this the run measures the test
# process and none of the server it is talking to: the routers report ~20-30%
# when they are in fact among the best-exercised code in the tree. This works
# with no change to the tests because servercase builds the child environment
# from os.environ, and it implies parallel mode — so `coverage combine` has to
# run before `coverage report`.
patch = ["subprocess"]
# The uvicorn child is stopped with terminate(), and it dies on the default
# SIGTERM disposition (exit -15), so atexit never runs and its data is dropped
# on the floor. This installs a handler that writes the file first.
sigterm = true

[tool.coverage.report]
show_missing = true
precision = 1
# Read every number here as a floor. Inside an async request handler the C
# tracer stops recording the handler's own frame after it suspends on a real
# await and picks it up again later, so stretches of code that provably ran
# (capture/api/ingest.py 76-104 runs on every accepted batch — the sessionstore
# write below it is covered) are reported missing. It is not uvloop, not
# BaseHTTPMiddleware and not the options above; all three were ruled out.
# capture/api/* is the module set to distrust, and always in the pessimistic
# direction.
# Deliberately no fail_under. Coverage is reported for a few weeks before
# anything is gated on it; a threshold picked before the baseline is known is a
# threshold that gets lowered.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests/server"]
markers = [
    "unit: no database, no network, no disk",
    "integration: needs a real Postgres",
]
