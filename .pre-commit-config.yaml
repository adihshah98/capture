# Moves the style gate before the commit, so CI stops being where formatting is
# discovered. Install once: pre-commit install
#
# capture/analyze and src/analyze are excluded in pyproject.toml's ruff config,
# which these hooks inherit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the same version as requirements-dev.txt. A hook and a CLI on
    # different ruff versions format differently, which turns CI into a coin toss.
    rev: v0.8.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      # tests/fixtures carries a 5k-line baseline that is meant to be large.
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: ^tests/fixtures/
