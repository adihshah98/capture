<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture — Trigger Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c1e21; }
    .hero { padding: 56px 24px; text-align: center; background: linear-gradient(135deg, #0f766e, #14b8a6); color: #fff; }
    .hero h1 { font-size: 36px; margin: 0 0 12px; }
    .hero p { font-size: 17px; opacity: 0.9; margin: 0; }
    section { max-width: 640px; margin: 0 auto; padding: 40px 24px; }
    .status { font-size: 15px; padding: 12px 16px; border-radius: 8px; background: #f3f4f6; margin-bottom: 24px; }
    .status b { font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .actions button { padding: 10px 20px; border-radius: 8px; border: 1px solid #d0d3d8; background: #fff; cursor: pointer; font-size: 15px; }
    .actions button.primary { background: #0f766e; color: #fff; border-color: #0f766e; }
    footer { text-align: center; padding: 24px; color: #6b7280; font-size: 13px; }
    footer a { color: #0f766e; }
  </style>
  <script>
    // Trigger mode: nothing is sent to the server until a trigger fires.
    // Events buffer in memory so the trigger keeps the lead-up.
    // Override any option via ?config={"sampleRate":0} for experimenting.
    window.CAPTURE_CONFIG = Object.assign(
      {
        triggers: {
          urls: ['#record$'],   // navigating to #record starts sending
          onException: true,    // an uncaught error starts sending
        },
      },
      JSON.parse(new URLSearchParams(location.search).get('config') || '{}')
    );
  </script>
  <script src="/capture.js"></script>
</head>
<body>
  <div class="hero">
    <h1>Trigger Demo</h1>
    <p>This page buffers the recording client-side and only sends it once a trigger fires.</p>
  </div>

  <section>
    <div class="status">Recorder status: <b id="status">loading…</b></div>
    <div class="actions">
      <button class="primary" id="manual-trigger">Fire manual trigger</button>
      <button id="throw-uncaught">Throw an uncaught error</button>
      <button id="url-trigger">Navigate to #record</button>
    </div>
  </section>

  <footer>
    Interact first, then fire a trigger — the replay will include what happened <em>before</em> it.
    Watch in the <a href="/replay.html">replay UI</a>.
  </footer>

  <script>
    const statusEl = document.getElementById('status');
    setInterval(() => {
      statusEl.textContent = window.capture ? window.capture.status() : 'loading…';
    }, 500);
    document.getElementById('manual-trigger').addEventListener('click', () => {
      window.capture && window.capture.trigger('demo-button');
    });
    document.getElementById('throw-uncaught').addEventListener('click', () => {
      setTimeout(() => { throw new Error('demo uncaught error'); }, 0);
    });
    document.getElementById('url-trigger').addEventListener('click', () => {
      location.hash = 'record';
    });
  </script>
</body>
</html>
