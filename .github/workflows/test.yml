name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3.9 is too old for the pinned fastapi, matching the production box.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Install server dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      # Client tests build the bundles first, so this also catches build breaks.
      - run: npm test
