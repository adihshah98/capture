name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs in ~20s with no Postgres and no npm install, so a formatting or typing
  # mistake fails before the 3-minute test job has finished booting a database.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dev tooling
        run: |
          pip install --quiet -r requirements-dev.txt
          pip install --quiet -e .

      # capture/analyze is excluded in pyproject.toml — it belongs to the
      # analysis refactor and must not be reformatted from here.
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy capture/

      # The fast tier: no Postgres, so it belongs here rather than in the test
      # job. Enforced by tests/conftest.py, which fails a unit test that opens a
      # database connection.
      - run: pytest tests/server -m unit -q

  test:
    runs-on: ubuntu-latest

    services:
      # Matches the production RDS instance.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CAPTURE_TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Never let the tenant isolation guard skip itself into a green build.
      CAPTURE_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 3.9 is too old for the pinned fastapi, matching the production box.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Install server dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
          # Editable, so tests import capture the way production does rather than
          # by prepending the repo root to sys.path.
          .venv/bin/pip install --quiet --no-deps -e .

      # Client tests build the bundles first, so this also catches build breaks.
      - run: npm test

      # Reporting only, for a few weeks, before anything is gated on the number.
      # No --fail-under, and continue-on-error so a flaky run or a coverage bug
      # can never turn this build red — `npm test` above is what decides that.
      # It re-runs the server suite rather than measuring the run above, so the
      # pass/fail signal stays in a step that is allowed to fail.
      - name: Coverage report (advisory)
        continue-on-error: true
        run: |
          # The pin lives in requirements-dev.txt; this job installs only the
          # runtime deps, so take that one line rather than the whole dev set.
          .venv/bin/pip install --quiet "$(grep '^coverage==' requirements-dev.txt)"
          .venv/bin/python -m coverage erase
          .venv/bin/python -m coverage run -m unittest discover -s tests/server
          # combine, not report: the HTTP tests measure a uvicorn subprocess,
          # which writes its own data file.
          .venv/bin/python -m coverage combine
          .venv/bin/python -m coverage report --sort=cover
          {
            echo '## Coverage (`capture/`, excluding `capture/analyze/`)'
            .venv/bin/python -m coverage report --format=markdown --sort=cover
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory only, and deliberately non-blocking: seven pinned runtime deps had
  # no advisory check at all, but a new CVE must not be able to wedge a deploy.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install --quiet pip-audit

      - run: pip-audit --requirement requirements.txt --strict
